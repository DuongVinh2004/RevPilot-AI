name: Feature Request
description: Propose a new feature or enhancement for RevPilot AI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea for RevPilot AI!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariant Considerations
      description: Does this feature affect platform safety or tenant isolation invariants?
      options:
        - label: This change respects multi-tenancy isolation (INV-TEN-001)
          required: false
        - label: This change requires human approval for mutating actions (INV-ACT-003)
          required: false
