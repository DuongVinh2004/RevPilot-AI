name: Technical Support & RFC
description: Ask a technical question, seek deployment guidance, or propose an RFC
title: "[Support/RFC]: "
labels: ["support", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check the [Platform Documentation](https://github.com/DuongVinh2004/RevPilot-AI/tree/main/docs) and [Architecture Decision Records](https://github.com/DuongVinh2004/RevPilot-AI/tree/main/docs/31-adr).
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Deployment / Docker / Infra
        - Ingestion / Telemetry Connectors
        - Causal Inference / ML Worker
        - Approval Gate / HMAC Tokens
        - Temporal Workflows
        - General Architecture & RFC
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context & Question
      description: Provide detailed context, configuration snippets, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: OS version, Docker/Python/Node versions, deployment target (Local/Staging/Production).
      placeholder: |
        OS: Ubuntu 22.04 / Windows 11
        Docker: 26.0+
        Python: 3.12
        Node: 20
    validations:
      required: false
