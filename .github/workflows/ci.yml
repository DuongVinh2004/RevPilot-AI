name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock --no-deps
          pip install -e . --no-deps
          pip install ruff mypy pytest pip-audit

      - name: Audit Python Dependencies
        run: |
          pip-audit -r requirements.lock

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Typecheck with Mypy
        run: |
          mypy packages/backend/src apps/api

      - name: Verify Pytest Collection
        run: |
          python -m pytest --collect-only -q

      - name: Run Test Suite
        run: |
          python -m pytest tests/ packages/backend/tests/ -v

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck and Build
        working-directory: apps/web
        run: npm run build

  infra-check:
    name: Infrastructure Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive infra/

      - name: Terraform Validate
        run: |
          terraform -chdir=infra/environments/staging init -backend=false
          terraform -chdir=infra/environments/staging validate
