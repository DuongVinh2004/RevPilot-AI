<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>RevPilot AI — Human Approval Portal & Revenue Intelligence</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <!-- WCAG 2.2 AA: Skip to main content landmark -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Static Semantic Landmarks for WCAG Accessibility Conformance -->
  <header role="banner" class="sr-only">
    <h1>RevPilot AI Revenue Governance</h1>
    <nav role="navigation" aria-label="Fallback Navigation"></nav>
  </header>

  <main id="main-content" role="main" class="sr-only" tabindex="-1"></main>
  <aside role="complementary" aria-label="System Invariant Status" class="sr-only"></aside>
  <footer role="contentinfo" class="sr-only">RevPilot AI Accessibility Conformance</footer>

  <!-- Live Announcer regions (WCAG 2.2 AA) -->
  <div id="status-announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="alert-announcer" class="sr-only" role="alert" aria-live="assertive"></div>

  <!-- React Application Mounting Root -->
  <div id="root"></div>

  <script type="module" src="./main.tsx"></script>
</body>
</html>
