[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revpilot-backend"
version = "0.1.0"
description = "RevPilot AI — Modular Monolith Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "temporalio>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["packages/backend/src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "packages/backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["packages/backend/src", "."]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "E722", "F401", "F841", "E741", "F821"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"packages/backend/tests/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
